apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-all-ingress-egress
  namespace: production
  annotations:
    description: "Enforces strict Zero-Trust baseline: drops all unapproved ingress and egress packets at the eBPF layer."
    framework: "NIST-SP-800-207-ZeroTrust"
spec:
  endpointSelector:
    matchLabels: {}
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
